aid: black-ore
name: Black Ore
description: 'Black Ore is an enterprise AI company building Tax Autopilot, an AI-native
  platform that automates tax preparation and review for accounting firms and financial-services
  professionals. Its models ingest source documents, then classify and extract data
  using machine learning and computer vision, compute individual (1040) and pass-through
  (1041/1065, K-1/K-3) returns, generate workpapers, and route results through CPA-supervised
  quality review, pushing prepared data into existing tax software such as CCH Axcess,
  Drake, Lacerte, ProSystem fx, and UltraTax. Founded in 2022 and backed by Andreessen
  Horowitz, Oak HC/FT, Founders Fund, General Catalyst, and Khosla Ventures.'
